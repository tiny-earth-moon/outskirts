excluded:
  - "**/.build"
  - Tests/Fixtures
  - Tests/AccessibilityTests/AccessibilityProject
  - Tests/XcodeTests/UIKitProject
  - Tests/XcodeTests/SwiftUIProject

opt_in_rules:
  - single_test_class

disabled_rules:
  # Formatting is handled by SwiftFormat
  - trailing_comma
  - opening_brace
  - vertical_parameter_alignment_on_call
  - let_var_whitespace
  - indentation_width
  - attributes
  - anonymous_argument_in_multiline_closure
  - vertical_whitespace_between_cases

  # Length/size rules
  - closure_body_length
  - line_length
  - identifier_name
  - type_name

  # Other
  - discouraged_optional_collection
  - non_optional_string_data_conversion # https://github.com/realm/SwiftLint/issues/5263#issuecomment-2115182747
  - balanced_xctest_lifecycle
  - todo
  - for_where

# Size thresholds are a ratchet set to the current worst case: lower them, never raise them.
file_length: {warning: 721, error: 721}
type_body_length: {warning: 548, error: 548}
function_body_length: {warning: 106, error: 106}
cyclomatic_complexity: {warning: 41, error: 41}
function_parameter_count: {warning: 8, error: 8}
large_tuple: {warning: 6, error: 6}
